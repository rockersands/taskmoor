name: Single sign-on

# OpenID Connect (M1-080) and SAML 2.0 (M1-081) sign-in against a real Keycloak:
# tools/sso/keycloak-test.sh starts it with the test realm and runs
# apps/server/src/sso/keycloak.e2e.test.ts and keycloak-saml.e2e.test.ts. Runs when sign-in code
# changes, weekly, and on demand.
on:
  # Manual only until M1 is finished (the user's decision, 2026-10-30; see HANDOFF).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keycloak:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sign in through Keycloak
        run: bash tools/sso/keycloak-test.sh
