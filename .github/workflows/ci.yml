name: CI

# Sized for GitHub's free private-repo minutes: pull requests run one Linux job; pushes to main
# add Postgres 18 and the security scan; the Windows check runs weekly or on demand.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Postgres 16, e2e, DCO)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway password of the CI service container.
      TASKMOOR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres # secret-scan: allow
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Branch protection needs a paid plan on private repos, so this check is the DCO gate.
      - name: DCO sign-off
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          else
            range="$HEAD_SHA"
          fi
          pnpm dco "$range"

      - name: Install Playwright browser
        run: pnpm --filter @taskmoor/web exec playwright install --with-deps chromium

      - name: Verify (lint, types, tests, e2e)
        run: pnpm verify --ci

      - name: Keep logs and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-pg16
          path: .verify/
          retention-days: 7

  # The newest Postgres catches upcoming behaviour changes.
  verify-pg18:
    name: verify (Postgres 18)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TASKMOOR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres # secret-scan: allow
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @taskmoor/web exec playwright install --with-deps chromium
      - run: pnpm verify --ci --only=tests
      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-pg18
          path: .verify/
          retention-days: 7

  # The embedded Postgres harness is what runs on developer machines without Docker. Windows
  # minutes count double on private repos, so this runs weekly and on demand.
  windows:
    name: verify (Windows, embedded Postgres)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @taskmoor/web exec playwright install chromium
      - run: pnpm verify --ci --only=types,tests
      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-windows
          path: .verify/
          retention-days: 7

  # Software bill of materials and known-vulnerability gate. CodeQL joins once the repo is public
  # (it needs GitHub Advanced Security on private repos). Third-party actions are pinned by
  # commit SHA so a moved tag cannot change what runs.
  security:
    name: security (SBOM, vulnerabilities)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
      - name: Vulnerability scan (fixable high and critical fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The one image of ADR-021, built for both architectures (M0-025, M0-011). The build stage
  # runs natively; only the runtime stage is per-architecture. The amd64 image answers /health
  # with no database, which is the acceptance check; registry pushes come with the release task.
  image:
    name: image (amd64, arm64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for both architectures
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "TASKMOOR_VERSION=${GITHUB_SHA::12}" \
            --cache-from type=gha --cache-to type=gha,mode=max \
            -t taskmoor:ci .
      - name: Load the amd64 image and probe it
        run: |
          docker buildx build --platform linux/amd64 --cache-from type=gha --load -t taskmoor:ci .
          size=$(docker image inspect taskmoor:ci --format '{{.Size}}')
          echo "image size: $((size / 1000000)) MB"
          test "$size" -le 400000000
          docker run -d --rm --name app -e TASKMOOR_ROLE=web -p 8080:8080 taskmoor:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"ok"'
          docker rm -f app
      - name: All-in-one image and Compose kits
        run: TAG=taskmoor:ci bash tools/image/smoke-kits.sh
      - name: Backup and restore drill
        run: TAG=taskmoor:ci bash tools/image/drill-backup.sh
