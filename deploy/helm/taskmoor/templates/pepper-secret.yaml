{{- /*
The password pepper (ASVS 2.4.5, ADR-019): one random key for every pod, created at the first
install and read back at every upgrade, so it never changes by accident. The Secret survives
`helm uninstall` (resource-policy keep): without the key no stored password verifies.
*/ -}}
{{- if not .Values.passwordPepper.existingSecret }}
{{- $name := printf "%s-password-pepper" (include "taskmoor.fullname" .) }}
{{- $key := .Values.passwordPepper.existingSecretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "taskmoor.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
