# helm test: the app answers through its Service, the database is reachable, and the metrics
# endpoint publishes the build info. It retries for a minute while a new cluster settles.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "taskmoor.fullname" . }}-test
  labels:
    {{- include "taskmoor.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    # Kept after success so `helm test --logs` shows the probe's output; replaced next run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: probe
      image: {{ include "taskmoor.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command:
        - node
        - -e
        - |
          const base = 'http://{{ include "taskmoor.fullname" . }}:{{ .Values.service.port }}';
          const metrics = 'http://{{ include "taskmoor.fullname" . }}-metrics:{{ .Values.metrics.port }}/metrics';
          const get = async (url) => {
            const res = await fetch(url);
            const text = await res.text();
            if (!res.ok) throw new Error(`${url} answered ${res.status}: ${text}`);
            return text;
          };
          const main = async () => {
            const health = JSON.parse(await get(`${base}/health`));
            if (health.status !== 'ok') throw new Error(`health: ${JSON.stringify(health)}`);
            await get(`${base}/ready`);
            const setup = JSON.parse(await get(`${base}/api/v1/setup`));
            if (typeof setup.needed !== 'boolean') throw new Error(`setup: ${JSON.stringify(setup)}`);
            if (!(await get(metrics)).includes('taskmoor_build_info')) throw new Error('no build info');
            {{- if eq (.Values.webRouting | default "path") "path" }}
            // Clean URLs (M1-134): a deep link is the app itself, on the first visit and a reload.
            for (const url of [`${base}/tickets/ABC-1`, `${base}/tickets/ABC-1`, `${base}/`]) {
              const res = await fetch(url, { headers: { accept: 'text/html' }, redirect: 'manual' });
              const page = await res.text();
              if (res.status !== 200 || !page.includes('taskmoor-config')) {
                throw new Error(`${url} answered ${res.status}, not the app`);
              }
            }
            {{- end }}
            console.log(`ok: version ${health.version}, roles ${health.roles.join(',')}`);
          };
          // A fresh cluster can take a few seconds to route a new Service: try for a minute.
          const deadline = Date.now() + 60_000;
          const attempt = () =>
            main().catch(async (error) => {
              const why = `${error.message}${error.cause?.code ? ` (${error.cause.code})` : ''}`;
              if (Date.now() > deadline) { console.error(why); process.exit(1); }
              await new Promise((resolve) => setTimeout(resolve, 2000));
              return attempt();
            });
          attempt();
