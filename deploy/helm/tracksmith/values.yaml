# Tracksmith Helm chart values (M1-099, OPS-018). The defaults suit a small cluster with an
# external PostgreSQL; see deploy/helm/README.md for an HA example.

image:
  repository: ghcr.io/rockersands/tracksmith
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Where people reach the instance; the setup link and secure cookies follow it.
publicUrl: "http://tracksmith.local"

database:
  # Name of an existing Secret holding the connection string (recommended).
  existingSecret: ""
  existingSecretKey: DATABASE_URL
  # Or the connection string itself; the chart then creates a Secret for it.
  url: ""

# A fixed first-run setup token (at least 16 characters) from an existing Secret; otherwise the
# app logs a fresh one at every start: kubectl logs deploy/<release>-app | grep "first-run".
setupToken:
  existingSecret: ""
  existingSecretKey: TRACKSMITH_SETUP_TOKEN

# Attachments and backups (ADR-020). With more than one app replica, use S3 (or a
# ReadWriteMany volume): a ReadWriteOnce volume can only be mounted by one pod.
storage:
  type: local # local | s3
  local:
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  s3:
    endpoint: ""
    bucket: ""
    region: ""
    forcePathStyle: false
    # Secret with S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY.
    existingSecret: ""

logLevel: info
extraEnv: []

# OpenTelemetry traces (ADR-023); off unless an endpoint is set.
otel:
  endpoint: ""
  serviceName: tracksmith

metrics:
  port: 9464
  # Creates a Prometheus Operator ServiceMonitor.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# The app deployment serves the API, the frontend and realtime (TRACKSMITH_ROLE).
app:
  roles: api,web,realtime
  # One pod with local storage; two or more with storage.type s3 (or a ReadWriteMany volume).
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 1Gi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The worker deployment runs background jobs (ADR-015).
worker:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# Seconds a stopping pod keeps serving while it leaves the Service, so a rolling upgrade drops
# no requests; the app then finishes in-flight requests before it exits.
drainSeconds: 10
terminationGracePeriodSeconds: 40

# Runs `node cli.mjs check-upgrade` before `helm upgrade` changes anything (ADR-022); a blocking
# finding (database unreachable or newer than this release) stops the upgrade.
upgradeCheck:
  enabled: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: tracksmith.local
  tls: []

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }
