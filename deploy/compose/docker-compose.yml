# Tracksmith with a bundled PostgreSQL 16 (ADR-021). Copy .env.example to .env, set
# POSTGRES_PASSWORD, then: docker compose up -d. The app answers on http://localhost:8080.
# For an existing Postgres server use docker-compose.external.yml instead.
name: tracksmith

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tracksmith
      POSTGRES_USER: tracksmith
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracksmith -d tracksmith"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  tracksmith:
    image: ${TRACKSMITH_IMAGE:-tracksmith:dev}
    environment:
      DATABASE_URL: postgres://tracksmith:${POSTGRES_PASSWORD}@postgres:5432/tracksmith # secret-scan: allow
      TRACKSMITH_ROLE: ${TRACKSMITH_ROLE:-all}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TRACKSMITH_PORT:-8080}:8080"
    volumes:
      - tracksmith-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  tracksmith-data:
