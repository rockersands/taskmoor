# Taskmoor with a bundled PostgreSQL 16 (ADR-021). Copy .env.example to .env, set
# POSTGRES_PASSWORD, then: docker compose up -d. The app answers on http://localhost:8080.
# For an existing Postgres server use docker-compose.external.yml instead.
name: taskmoor

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: taskmoor
      POSTGRES_USER: taskmoor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmoor -d taskmoor"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  taskmoor:
    image: ${TASKMOOR_IMAGE:-taskmoor:dev}
    environment:
      DATABASE_URL: postgres://taskmoor:${POSTGRES_PASSWORD}@postgres:5432/taskmoor # secret-scan: allow
      TASKMOOR_ROLE: ${TASKMOOR_ROLE:-all}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TASKMOOR_SETUP_TOKEN: ${TASKMOOR_SETUP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TASKMOOR_PORT:-8080}:8080"
    volumes:
      - taskmoor-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  taskmoor-data:
