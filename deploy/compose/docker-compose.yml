# Taskmoor with a bundled PostgreSQL 16 (ADR-021). Copy .env.example to .env, set
# POSTGRES_PASSWORD, then: docker compose up -d. The app answers on http://localhost:8080.
# The backend talks to PostgreSQL over TLS with a certificate made at the first start
# (postgres-tls, ADR-111).
# For an existing Postgres server use docker-compose.external.yml instead.
name: taskmoor

services:
  postgres-tls:
    # The database's TLS certificate (ASVS 1.9.1, ADR-111): made at the first start, renewed
    # before it expires. A private authority whose key stays in the postgres-ca volume.
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.1-pg16-trixie}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        ca=$${TLS_CA_DIR:-/ca}
        out=$${TLS_DIR:-/tls}
        owner=$${TLS_KEY_OWNER:-postgres:postgres}
        host=$${TLS_HOST:-postgres}
        mkdir -p "$$ca" "$$out"
        if [ ! -s "$$ca/ca.key" ] || [ ! -s "$$ca/ca.crt" ]; then
          openssl req -x509 -new -nodes -newkey ec -pkeyopt ec_paramgen_curve:P-256 -sha256 -days 7300 \
            -subj "/CN=Taskmoor database CA" -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" -keyout "$$ca/ca.key" -out "$$ca/ca.crt" 2>/dev/null
          rm -f "$$out/server.crt"
          echo "postgres-tls: made the private certificate authority"
        fi
        if [ ! -s "$$out/server.crt" ] || [ ! -s "$$out/server.key" ] \
          || ! openssl x509 -checkend 7776000 -noout -in "$$out/server.crt" >/dev/null 2>&1 \
          || ! openssl verify -CAfile "$$ca/ca.crt" "$$out/server.crt" >/dev/null 2>&1; then
          printf 'subjectAltName=DNS:%s,DNS:localhost\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=serverAuth\n' "$$host" > "$$out/server.ext"
          openssl req -new -nodes -newkey ec -pkeyopt ec_paramgen_curve:P-256 -subj "/CN=$$host" \
            -keyout "$$out/server.key.new" -out "$$out/server.csr" 2>/dev/null
          openssl x509 -req -sha256 -days 3650 -in "$$out/server.csr" -CA "$$ca/ca.crt" -CAkey "$$ca/ca.key" \
            -set_serial "0x$$(openssl rand -hex 16)" -extfile "$$out/server.ext" -out "$$out/server.crt.new" 2>/dev/null
          mv "$$out/server.key.new" "$$out/server.key"
          mv "$$out/server.crt.new" "$$out/server.crt"
          rm -f "$$out/server.csr" "$$out/server.ext"
          echo "postgres-tls: issued the database certificate for $$host"
        fi
        cp "$$ca/ca.crt" "$$out/ca.crt"
        printf '%s\n' '# Written by the postgres-tls service (ADR-111): TLS for every network connection.' \
          'local   all all     trust' \
          'hostssl all all all scram-sha-256' \
          'host    all all all reject' > "$$out/pg_hba.conf"
        chown "$$owner" "$$out/server.key"
        chmod 600 "$$out/server.key" "$$ca/ca.key"
        chmod 644 "$$out/server.crt" "$$out/ca.crt" "$$out/pg_hba.conf"
        chmod 755 "$$out"
    volumes:
      - postgres-ca:/ca
      - postgres-tls:/tls
    restart: "no"

  postgres:
    # PostgreSQL 16 with pgvector, for the similar-ticket index (M1-078, ADR-106): the official
    # postgres:16 image plus the extension, on the same Debian release, so it takes over an
    # existing data volume as it is. Plain postgres:16 works too; lookups then scan exactly.
    # TLS for every network connection, with the certificate postgres-tls made (ADR-111).
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.1-pg16-trixie}
    environment:
      POSTGRES_DB: taskmoor
      POSTGRES_USER: taskmoor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - hba_file=/tls/pg_hba.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-tls:/tls:ro
    depends_on:
      postgres-tls:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmoor -d taskmoor"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  taskmoor:
    image: ${TASKMOOR_IMAGE:-taskmoor:dev}
    environment:
      # TLS to PostgreSQL, checked against the kit's own authority (ADR-111).
      DATABASE_URL: postgres://taskmoor:${POSTGRES_PASSWORD}@postgres:5432/taskmoor?sslmode=verify-full&sslrootcert=/db-tls/ca.crt # secret-scan: allow
      TASKMOOR_ROLE: ${TASKMOOR_ROLE:-all}
      # Clean URLs (M1-134, ADR-066); set hash where something in front cannot pass deep links.
      TASKMOOR_WEB_ROUTING: ${TASKMOOR_WEB_ROUTING:-path}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # A frontend kit on another origin (M1-107, ADR-080): its origin, and where OAuth returns.
      TASKMOOR_ALLOWED_ORIGINS: ${TASKMOOR_ALLOWED_ORIGINS:-}
      TASKMOOR_OAUTH_REDIRECT_URIS: ${TASKMOOR_OAUTH_REDIRECT_URIS:-}
      TASKMOOR_SETUP_TOKEN: ${TASKMOOR_SETUP_TOKEN:-}
      TASKMOOR_TRUSTED_PROXIES: ${TASKMOOR_TRUSTED_PROXIES:-}
      TASKMOOR_PASSWORD_PEPPER: ${TASKMOOR_PASSWORD_PEPPER:-}
      # AI (M1-075, ADR-098): the master key wraps stored provider keys; a key given here moves
      # into encrypted storage on the first start and is ignored after (install.sh removes it).
      TASKMOOR_MASTER_KEY: ${TASKMOOR_MASTER_KEY:-}
      TASKMOOR_MASTER_KEY_PREVIOUS: ${TASKMOOR_MASTER_KEY_PREVIOUS:-}
      TASKMOOR_AI_PROVIDER: ${TASKMOOR_AI_PROVIDER:-}
      TASKMOOR_AI_KEY: ${TASKMOOR_AI_KEY:-}
      TASKMOOR_AI_REGION: ${TASKMOOR_AI_REGION:-}
      TASKMOOR_AI_PROJECT: ${TASKMOOR_AI_PROJECT:-}
      TASKMOOR_AI_RESOURCE: ${TASKMOOR_AI_RESOURCE:-}
      TASKMOOR_AI_BASE_URL: ${TASKMOOR_AI_BASE_URL:-}
      TASKMOOR_AI_MODEL: ${TASKMOOR_AI_MODEL:-}
      # Outgoing mail (M1-057); or the setup form's mail fields with TASKMOOR_SMTP_PASSWORD.
      TASKMOOR_SMTP_URL: ${TASKMOOR_SMTP_URL:-}
      TASKMOOR_SMTP_USER: ${TASKMOOR_SMTP_USER:-}
      TASKMOOR_SMTP_PASSWORD: ${TASKMOOR_SMTP_PASSWORD:-}
      TASKMOOR_SMTP_FROM: ${TASKMOOR_SMTP_FROM:-}
      # Attachments (ADR-040): local files in the data volume, or an S3-compatible bucket.
      TASKMOOR_STORAGE: ${TASKMOOR_STORAGE:-}
      TASKMOOR_S3_BUCKET: ${TASKMOOR_S3_BUCKET:-}
      TASKMOOR_S3_REGION: ${TASKMOOR_S3_REGION:-}
      TASKMOOR_S3_ENDPOINT: ${TASKMOOR_S3_ENDPOINT:-}
      TASKMOOR_S3_PUBLIC_ENDPOINT: ${TASKMOOR_S3_PUBLIC_ENDPOINT:-}
      TASKMOOR_S3_FORCE_PATH_STYLE: ${TASKMOOR_S3_FORCE_PATH_STYLE:-}
      TASKMOOR_S3_PREFIX: ${TASKMOOR_S3_PREFIX:-}
      TASKMOOR_S3_ACCESS_KEY_ID: ${TASKMOOR_S3_ACCESS_KEY_ID:-}
      TASKMOOR_S3_SECRET_ACCESS_KEY: ${TASKMOOR_S3_SECRET_ACCESS_KEY:-}
      TASKMOOR_S3_SESSION_TOKEN: ${TASKMOOR_S3_SESSION_TOKEN:-}
      TASKMOOR_S3_SSE: ${TASKMOOR_S3_SSE:-}
      TASKMOOR_SCAN_CLAMD: ${TASKMOOR_SCAN_CLAMD:-}
      # Backups, imports and search (M1-101, M1-098, QRY-010).
      TASKMOOR_BACKUP_DIR: ${TASKMOOR_BACKUP_DIR:-}
      TASKMOOR_IMPORT_DIR: ${TASKMOOR_IMPORT_DIR:-}
      TASKMOOR_QUERY_TIMEOUT_MS: ${TASKMOOR_QUERY_TIMEOUT_MS:-}
      TASKMOOR_JIRA_COMPAT: ${TASKMOOR_JIRA_COMPAT:-on}
      # The new-version notice for administrators (OPS-026): off stops its daily look at the
      # project's public releases.
      TASKMOOR_UPDATE_CHECK: ${TASKMOOR_UPDATE_CHECK:-}
      TASKMOOR_UPDATE_COMMAND: ${TASKMOOR_UPDATE_COMMAND:-}
      # Metrics and traces (ADR-023).
      METRICS_PORT: ${METRICS_PORT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TASKMOOR_PORT:-8080}:8080"
    volumes:
      - taskmoor-data:/data
      - postgres-tls:/db-tls:ro
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-ca:
  postgres-tls:
  taskmoor-data:
