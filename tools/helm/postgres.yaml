# A throwaway PostgreSQL for the kind test (tools/helm/kind-test.sh). Not for real installs:
# no persistence, a fixed test password.
apiVersion: v1
kind: Secret
metadata:
  name: tracksmith-db
stringData:
  POSTGRES_PASSWORD: kind-test-password
  DATABASE_URL: postgres://tracksmith:kind-test-password@postgres:5432/tracksmith # secret-scan: allow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16.10-alpine
          env:
            - { name: POSTGRES_USER, value: tracksmith }
            - { name: POSTGRES_DB, value: tracksmith }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: tracksmith-db, key: POSTGRES_PASSWORD } }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "tracksmith"] }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
