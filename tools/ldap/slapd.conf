# slapd configuration for the directory sync end-to-end test (M1-082). @ROOT_PASSWORD_HASH@ is
# filled in at start with a hash of a password made per run.
include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
include /etc/ldap/schema/nis.schema

modulepath /usr/lib/ldap
moduleload back_mdb
moduleload ppolicy

pidfile /run/slapd/slapd.pid
argsfile /run/slapd/slapd.args

TLSCertificateFile /etc/ldap/taskmoor/tls/cert.pem
TLSCertificateKeyFile /etc/ldap/taskmoor/tls/key.pem

# Paged searches read every entry; the sync asks for 500 at a time.
sizelimit unlimited
timelimit unlimited

database mdb
maxsize 1073741824
suffix "dc=example,dc=com"
rootdn "cn=admin,dc=example,dc=com"
rootpw @ROOT_PASSWORD_HASH@
directory /var/lib/ldap
index objectClass eq
index uid,mail,cn eq
index member eq
index entryUUID eq
index modifyTimestamp eq

# The administrative lock (pwdAccountLockedTime 000001010000Z) marks a disabled account.
overlay ppolicy

access to attrs=userPassword
  by self write
  by dn.exact="cn=sync,dc=example,dc=com" write
  by anonymous auth
  by * none
access to *
  by dn.exact="cn=sync,dc=example,dc=com" write
  by users read
  by * none
